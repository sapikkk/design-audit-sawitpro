<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: Inter, sans-serif; font-size: 12px; margin: 0; padding: 12px; color: #222; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; margin: 8px 0 2px; color: #555; }
  input, select { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ddd; border-radius: 6px; }
  input[type=checkbox] { width: auto; }
  button { padding: 7px 10px; border: none; border-radius: 6px; background: #18A0FB; color: #fff; cursor: pointer; margin: 6px 4px 0 0; }
  button.sec { background: #eee; color: #222; }
  button.warn { background: #E53935; }
  .panel { display: none; margin-top: 10px; }
  .panel.on { display: block; }
  .card { padding: 8px; border: 1px solid #eee; border-radius: 8px; margin-top: 8px; }
  .score { font-size: 22px; font-weight: 600; }
  .muted { color: #777; }
  .filters { display: flex; gap: 6px; margin-top: 8px; }
  #list { max-height: 260px; overflow: auto; margin-top: 6px; }
  .row { display: flex; gap: 6px; align-items: flex-start; padding: 6px; border: 1px solid #eee; border-radius: 6px; margin: 4px 0; }
  .row .body { flex: 1; cursor: pointer; }
  .sev-HIGH { border-left: 4px solid #E53935; }
  .sev-MEDIUM { border-left: 4px solid #FF9800; }
  .sev-LOW { border-left: 4px solid #9E9E9E; }
  #notice { margin-top: 10px; padding: 6px; border-radius: 6px; background: #F5F5F5; min-height: 16px; }
</style>
</head>
<body>
<h2>DS Audit Pro</h2>

<label>Mode</label>
<select id="mode">
  <option value="audit">AUDIT FILE</option>
  <option value="apply">APPLY &amp; ANNOTATE</option>
  <option value="snapshot">SNAPSHOT TOKEN (opsional)</option>
</select>

<!-- PANEL AUDIT -->
<div class="panel on" id="p-audit">
  <label>Nama sprint</label>
  <input id="sprint" placeholder="Sprint 14">
  <label>Penanggung jawab</label>
  <input id="owner" placeholder="Nama desainer">
  <label>rules.json (bobot dan ambang, opsional; tanpa ini pakai default)</label>
  <input type="file" id="rulesFile" accept=".json">
  <label><input type="checkbox" id="scanAll"> Scan semua halaman</label>
  <button id="runBtn">Jalankan audit</button>
  <div id="progress" class="muted"></div>

  <div id="summary"></div>

  <div class="filters">
    <select id="fCat">
      <option value="">Semua kategori</option>
      <option>AUTO_LAYOUT</option><option>TYPOGRAPHY</option><option>COLOR</option>
      <option>SPACING</option><option>COMPONENT</option><option>NAMING</option>
    </select>
    <select id="fSev">
      <option value="">Semua severity</option>
      <option>HIGH</option><option>MEDIUM</option><option>LOW</option>
    </select>
  </div>
  <div id="list"></div>
  <button class="sec" id="exportBtn">Ekspor JSON</button>
</div>

<!-- PANEL APPLY -->
<div class="panel" id="p-apply">
  <p class="muted">Hanya pelanggaran dengan status EXACT yang bisa diterapkan. Jalankan audit dulu, lalu centang baris di panel Audit.</p>
  <button id="applySel">Terapkan terpilih</button>
  <button class="warn" id="applyAll">Terapkan semua EXACT</button>
  <button class="sec" id="annotateBtn">Buat anotasi</button>
  <button class="sec" id="clearBtn">Hapus anotasi</button>
  <div class="card">
    <label>Pulihkan dari file undo (.json)</label>
    <input type="file" id="undoFile" accept=".json">
    <button class="sec" id="undoBtn">Pulihkan</button>
  </div>
</div>

<!-- PANEL SNAPSHOT -->
<div class="panel" id="p-snapshot">
  <p class="muted">Hanya untuk dokumentasi. Mengunduh daftar token yang ditemukan plugin di file ini. Tidak dipakai saat audit.</p>
  <button id="snapshotBtn">Unduh snapshot token</button>
</div>

<div id="notice"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let rules = null, audit = null;

  function post(msg) { parent.postMessage({ pluginMessage: msg }, '*'); }
  function notice(text) { $('notice').textContent = text; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function download(name, obj) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function readJSON(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => { try { resolve(JSON.parse(r.result)); } catch (e) { reject(e); } };
      r.onerror = () => reject(r.error);
      r.readAsText(file);
    });
  }

  $('mode').onchange = () => {
    for (const m of ['audit', 'apply', 'snapshot']) {
      $('p-' + m).classList.toggle('on', $('mode').value === m);
    }
  };

  $('rulesFile').onchange = async (e) => {
    if (e.target.files[0]) { rules = await readJSON(e.target.files[0]); notice('rules.json dimuat.'); }
  };

  $('runBtn').onclick = () => {
    notice('');
    post({
      type: 'audit',
      rules: rules || {
        weights: { AUTO_LAYOUT: 20, TYPOGRAPHY: 20, COLOR: 20, SPACING: 15, COMPONENT: 20, NAMING: 5 },
        thresholds: { excellent: 90, warning: 75 },
        nearMatchDeltaE: 2.0,
        namingPatterns: {
          screen: '^Screen\\/[A-Za-z0-9-]+$',
          component: '^(Card|Button|Navbar|Input|Modal)\\/[A-Za-z0-9-]+$',
          text: '^Text\\/(Header|Body|Caption|Label)$'
        }
      },
      scope: $('scanAll').checked ? 'all' : 'page',
      sprint: $('sprint').value.trim(),
      owner: $('owner').value.trim()
    });
  };

  function renderAudit() {
    const s = $('summary');
    const counts = { HIGH: 0, MEDIUM: 0, LOW: 0 };
    audit.violations.forEach((v) => counts[v.severity]++);
    const exact = audit.violations.filter((v) => v.matchType === 'EXACT').length;
    s.innerHTML = `
      <div class="card">
        <div class="score">${audit.score.toFixed(1)}%</div>
        <div>${esc(audit.status)} · ${esc(audit.fileName)}</div>
        <div class="muted">Node: ${audit.nodeCount} · Tersembunyi dilewati: ${audit.hiddenSkipped} · Instance tak terselesaikan: ${audit.unresolvedInstances}</div>
        <div>HIGH ${counts.HIGH} · MEDIUM ${counts.MEDIUM} · LOW ${counts.LOW} · EXACT bisa diterapkan: ${exact}</div>
      </div>`;
    renderList();
  }

  function renderList() {
    const cat = $('fCat').value, sev = $('fSev').value;
    const list = $('list');
    list.innerHTML = '';
    audit.violations.forEach((v, i) => {
      if (cat && v.category !== cat) return;
      if (sev && v.severity !== sev) return;
      const row = document.createElement('div');
      row.className = 'row sev-' + v.severity;
      const check = v.matchType === 'EXACT' ? `<input type="checkbox" data-i="${i}">` : '';
      row.innerHTML = `
        ${check}
        <div class="body" data-id="${esc(v.id)}">
          <div><b>${esc(v.layerName)}</b> <span class="muted">${esc(v.topLevelScreen)}</span></div>
          <div>${esc(v.category)} · ${esc(v.severity)} · ${esc(v.matchType)}</div>
          <div class="muted">${esc(v.issue)}</div>
          <div class="muted">${esc(v.suggestion || '')}</div>
        </div>`;
      list.appendChild(row);
    });
    list.querySelectorAll('.body').forEach((el) => {
      el.onclick = () => post({ type: 'select', nodeId: el.dataset.id });
    });
  }
  $('fCat').onchange = () => audit && renderList();
  $('fSev').onchange = () => audit && renderList();

  $('exportBtn').onclick = () => {
    if (!audit) { notice('Jalankan audit dulu.'); return; }
    const safe = (audit.fileName || 'file').replace(/[^a-z0-9-_]+/gi, '_');
    download(`audit-${safe}.json`, audit);
  };

  $('applySel').onclick = () => {
    if (!audit) { notice('Jalankan audit dulu.'); return; }
    const items = [...document.querySelectorAll('#list input[type=checkbox]:checked')]
      .map((c) => audit.violations[Number(c.dataset.i)]);
    if (items.length === 0) { notice('Centang baris EXACT dulu.'); return; }
    post({ type: 'apply', items });
  };

  $('applyAll').onclick = () => {
    if (!audit) { notice('Jalankan audit dulu.'); return; }
    const items = audit.violations.filter((v) => v.matchType === 'EXACT');
    if (items.length === 0) { notice('Tidak ada pelanggaran EXACT.'); return; }
    if (!confirm(`Terapkan ${items.length} perubahan EXACT? Simpan file undo setelahnya.`)) return;
    post({ type: 'apply', items });
  };

  $('annotateBtn').onclick = () => {
    if (!audit) { notice('Jalankan audit dulu.'); return; }
    post({ type: 'annotate', violations: audit.violations });
  };
  $('clearBtn').onclick = () => post({ type: 'clear-annotations' });

  $('undoBtn').onclick = async () => {
    const f = $('undoFile').files[0];
    if (!f) { notice('Pilih file undo dulu.'); return; }
    post({ type: 'undo', log: await readJSON(f) });
  };

  $('snapshotBtn').onclick = () => post({ type: 'snapshot' });

  window.onmessage = (ev) => {
    const m = ev.data && ev.data.pluginMessage;
    if (!m) return;
    if (m.type === 'progress') {
      $('progress').textContent = `Memindai... ${m.done} node`;
    } else if (m.type === 'audit-result') {
      audit = m.data;
      $('progress').textContent = '';
      renderAudit();
      notice('Audit selesai.');
    } else if (m.type === 'snapshot-result') {
      download(`token-snapshot-${Date.now()}.json`, m.data);
    } else if (m.type === 'apply-result') {
      notice(`Diterapkan ${m.applied}, dilewati ${m.skipped}. File undo diunduh.`);
      download(`undo-${Date.now()}.json`, m.undo);
    } else if (m.type === 'notice') {
      notice(m.text);
    }
  };
</script>
</body>
</html>
